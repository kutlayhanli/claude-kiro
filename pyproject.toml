[project]
name = "claude-kiro"
version = "0.10.3"
description = "Spec-driven development methodology for Claude Code"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Fredrik Angelsen", email = "fredrikangelsen@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["claude-code", "kiro", "spec-driven-development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.3.0",
]

[project.urls]
Homepage = "https://angelsen.github.io/claude-kiro/"
Documentation = "https://angelsen.github.io/claude-kiro/getting-started.html"
Repository = "https://github.com/angelsen/claude-kiro"
Issues = "https://github.com/angelsen/claude-kiro/issues"

[project.scripts]
# Main CLI
ck = "claude_kiro.cli:cli"
ck-status-line = "claude_kiro.statusline:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# plugin/ (the Claude Code plugin, at the repo root so the marketplace can point
# at it) is the one source of the commands, workflows and agents. The wheel
# carries it as package data (claude_kiro/_plugin) so `ck vendor` works offline.
[tool.hatch.build.targets.sdist]
include = ["src", "plugin", ".claude-plugin", "README.md", "UPGRADING.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_kiro"]

[tool.hatch.build.targets.wheel.force-include]
"plugin" = "claude_kiro/_plugin"

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "pytest>=9.1.1",
    "pytest-xdist>=3.6",
]
